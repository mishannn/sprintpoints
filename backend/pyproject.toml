[project]
name = "sprintpoints-backend"
version = "3.0.0"
description = "Sprint Points API: FastAPI + SQLAlchemy on Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "sqlalchemy>=2.0",
    "sqlalchemy-cloudflare-d1>=0.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
