name: Backend and frontend checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sprintpoints_test
          POSTGRES_USER: sprintpoints
          POSTGRES_PASSWORD: sprintpoints
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprintpoints -d sprintpoints_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://sprintpoints:sprintpoints@localhost:5432/sprintpoints_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o .tmp/sprintpoints-server ./backend/cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:frontend-csv
      - run: npm run build
