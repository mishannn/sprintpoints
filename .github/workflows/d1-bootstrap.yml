name: D1 bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Ensure the D1 database exists
        working-directory: backend
        run: |
          set -e
          if npx --yes wrangler@latest d1 info sprintpoints; then
            echo "D1 database already exists"
          else
            npx --yes wrangler@latest d1 create sprintpoints
          fi
